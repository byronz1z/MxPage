name: Regression tests
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx playwright-core install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright-core install chromium
        if: runner.os != 'Linux'
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-failure-${{ matrix.os }}
          path: test-output/
